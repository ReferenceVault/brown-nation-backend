services:
  postgres:
    image: postgres:16-alpine
    container_name: brown-nation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brown_nation
      POSTGRES_PASSWORD: brown_nation
      POSTGRES_DB: brown_nation
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brown_nation']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: brown-nation-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brownnation
      MINIO_ROOT_PASSWORD: brownnation123
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
